name: Update data and ratings

# snooker.org allows 2 requests per minute, so the first full download (back to
# 2010, roughly 700 requests) takes more than one 6-hour GitHub run. Each run
# saves what it has fetched and, if unfinished, starts the next run itself.
# After that, the daily run only re-fetches events that are in progress.

on:
  workflow_dispatch:
    inputs:
      from_season:
        description: "First season to download"
        default: "2010"
  schedule:
    - cron: "41 6 * * *"   # daily

permissions:
  contents: write
  actions: write

concurrency:
  group: data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check the snooker.org header is set
        id: check
        env:
          SNOOKER_ORG_HEADER: ${{ secrets.SNOOKER_ORG_HEADER }}
        run: |
          if [ -z "$SNOOKER_ORG_HEADER" ]; then
            echo "No SNOOKER_ORG_HEADER secret yet - skipping."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Download results
        if: steps.check.outputs.ready == 'true'
        env:
          SNOOKER_ORG_HEADER: ${{ secrets.SNOOKER_ORG_HEADER }}
        run: python src/fetch_data.py --from-season "${{ inputs.from_season || '2010' }}" --max-minutes 320
      - name: Build ratings
        if: steps.check.outputs.ready == 'true'
        run: |
          if grep -q yes data/download_complete; then
            python src/elo.py --tune
            python src/elo.py
          else
            echo "Download not finished yet - ratings will be built once it is."
          fi
      - name: Commit
        if: always() && steps.check.outputs.ready == 'true'
        run: |
          git config user.name "data-bot"
          git config user.email "data-bot@users.noreply.github.com"
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "Update data and ratings"
            git pull --rebase
            git push
          fi
      - name: Carry on if the download isn't finished
        if: steps.check.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if grep -q no data/download_complete; then
            gh workflow run update-data.yml --ref main -f from_season="${{ inputs.from_season || '2010' }}"
          fi
